version: '3.8'

services:
  mt-rage-postgres:
    image: ${RAGE_POSTGRES_IMAGE:-postgres:17.6-alpine}
    container_name: mt-rage-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: '${RAGE_POSTGRES_DATABASE:-ragem}'
      POSTGRES_USER: '${RAGE_POSTGRES_USER:-ragem}'
      POSTGRES_PASSWORD: '${RAGE_POSTGRES_PASSWORD:?RAGE_POSTGRES_PASSWORD is required}'
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mt-rage-postgres-data:/var/lib/postgresql/data
    networks: [fl-network]

  mt-rage:
    image: ${RAGE_NODE_IMAGE:-node:24-bookworm}
    container_name: mt-rage
    restart: unless-stopped
    init: true
    depends_on:
      mt-rage-postgres:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -Eeuo pipefail
        : "$${RAGE_REPOSITORY_URL:?RAGE_REPOSITORY_URL is required}"
        : "$${RAGE_GIT_REF:?RAGE_GIT_REF is required}"
        readonly source_directory=/workspace/source

        if [[ ! -d "$${source_directory}/.git" ]]; then
          if [[ -e "$${source_directory}" ]] && [[ -n "$$(find "$${source_directory}" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo "$${source_directory} existe, pero no es un checkout Git válido." >&2
            exit 1
          fi
          git clone --no-checkout "$${RAGE_REPOSITORY_URL}" "$${source_directory}"
        fi

        current_origin="$$(git -C "$${source_directory}" remote get-url origin)"
        if [[ "$${current_origin}" != "$${RAGE_REPOSITORY_URL}" ]]; then
          git -C "$${source_directory}" remote set-url origin "$${RAGE_REPOSITORY_URL}"
        fi

        git -C "$${source_directory}" fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

        resolved_commit=""
        for candidate in "refs/remotes/origin/$${RAGE_GIT_REF}" "refs/tags/$${RAGE_GIT_REF}" "$${RAGE_GIT_REF}"; do
          if resolved_commit="$$(git -C "$${source_directory}" rev-parse --verify "$${candidate}^{commit}" 2>/dev/null)"; then break; fi
        done

        if [[ -z "$${resolved_commit}" ]]; then
          echo "RAGE_GIT_REF '$${RAGE_GIT_REF}' no corresponde a una rama, etiqueta o commit." >&2
          exit 1
        fi

        git -C "$${source_directory}" checkout --detach --force "$${resolved_commit}"
        git -C "$${source_directory}" clean -ffdx
        cd "$${source_directory}"
        npm ci --include=dev
        npm run build
        echo "Iniciando Rage Motors desde el commit $${resolved_commit}."
        exec npm run start -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: 'postgresql://${RAGE_POSTGRES_USER:-ragem}:${RAGE_POSTGRES_PASSWORD:?RAGE_POSTGRES_PASSWORD is required}@mt-rage-postgres:5432/${RAGE_POSTGRES_DATABASE:-ragem}'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}'
      BETTER_AUTH_URL: '${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}'
      DISCORD_CLIENT_ID: '${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}'
      DISCORD_CLIENT_SECRET: '${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}'
      AUTHORIZED_DISCORD_IDS: '${AUTHORIZED_DISCORD_IDS:?AUTHORIZED_DISCORD_IDS is required}'
      RAGE_REPOSITORY_URL: '${RAGE_REPOSITORY_URL:-https://github.com/niflaot/rage-motors.git}'
      RAGE_GIT_REF: '${RAGE_GIT_REF:?RAGE_GIT_REF is required}'
      GIT_TERMINAL_PROMPT: '0'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    expose: ['3000']
    networks: [fl-network]

volumes:
  mt-rage-postgres-data:
    name: mt-rage-postgres-data

networks:
  fl-network:
    external: true
